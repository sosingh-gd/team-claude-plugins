name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      # Same entrypoint developers use locally
      - name: Format, lint, typecheck, test
        run: make check
      - name: Coverage
        run: make cov
