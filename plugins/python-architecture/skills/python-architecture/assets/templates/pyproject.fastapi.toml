[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{project_name}} API service"
readme = "README.md"
requires-python = ">={{python_version}}"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{package_name}}"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py{{python_short}}"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "ARG",      # unused arguments
    "PTH",      # prefer pathlib
    "T20",      # no print()
    "ERA",      # commented-out code
    "ASYNC",    # async pitfalls (blocking calls in async def)
    "FAST",     # FastAPI-specific rules
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/etc. in argument defaults are intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "{{python_version}}"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that need external services"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/{{package_name}}"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
