[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{project_name}} command-line tool"
readme = "README.md"
requires-python = ">={{python_version}}"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
{{project_name}} = "{{package_name}}.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{package_name}}"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py{{python_short}}"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "ARG",      # unused arguments
    "PTH",      # prefer pathlib
    "T20",      # no print()
    "ERA",      # commented-out code
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "S105", "S106"]
"src/{{package_name}}/cli.py" = ["T20"]  # CLIs may print

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "{{python_version}}"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: tests that need external services"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/{{package_name}}"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
